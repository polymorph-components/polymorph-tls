[package]
name = "tls-virt-host"
description = "Experimental wasmtime embedding: a wasi:sockets host provider wrapping wasmtime-wasi's with transparent TLS tunneling"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
getrandom = { version = "0.3", features = ["std"] }
lann-tls = { path = "../../rust/tls" }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false }
wasmtime = "47"
wasmtime-wasi = { version = "47", features = ["p3"] }
