[package]
name = "tls-tcp"
description = "Real-transport demo: the polymorph:tls component over wasi:sockets TCP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to wasip3's wit-bindgen line: the app links both runtimes'
# generated code, and mixing async-runtime versions in one binary risks
# split waitable state.
wit-bindgen = { version = "0.57", features = ["async"] }
wasip3 = { workspace = true }
futures = { workspace = true }
