[package]
name = "tls-virt-wasmtime"
description = "wasmtime embedding: a wasi:sockets host provider wrapping wasmtime-wasi's with transparent TLS tunneling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
lann-tls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tls-virt-common = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false }
wasmtime = "47"
wasmtime-wasi = { version = "47", features = ["p3"] }
