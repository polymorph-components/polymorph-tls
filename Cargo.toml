[workspace]
members = [
    "rust/profile",
    "rust/tls",
    "rust/quinn",
    "rust/quinn-wasi",
    "rust/component",
    "rust/tls-virt-common",
    "rust/tls-virt-guest",
    "rust/tls-virt-wasmtime",
    "examples/quic-loopback",
    "examples/tls-loopback",
    "examples/tls-delegated-loopback",
    "examples/test-signer",
    "examples/webcrypto-signer",
    "examples/tls-tcp",
    "examples/tls-virt-demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lann-tls-profile = { path = "rust/profile" }

rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = "1"
# Pinned to the audited revision (rust/tls/README.md records the audit);
# bump deliberately and re-audit. Upstream has no usable release.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "7b44a2de957b6596d267a920d3aec0d4137defb1", default-features = false, features = ["std", "zeroize"] }
quinn-proto = { version = "0.11", default-features = false }

ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }

lann-tls = { path = "rust/tls" }
lann-tls-quinn = { path = "rust/quinn" }
tls-virt-common = { path = "rust/tls-virt-common" }
lann-quinn-wasi = { path = "rust/quinn-wasi" }

wasi = "0.14"
wit-bindgen = { version = "0.60", features = ["async-spawn"] }
wasip3 = "0.7"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

aead = { version = "0.6", default-features = false, features = ["alloc"] }
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
chacha20 = "0.10"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
bytes = "1"
