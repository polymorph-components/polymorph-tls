[workspace]
members = [
    "rust/profile",
    "rust/tls",
    "rust/quic",
    "rust/component",
    "rust/tls-virt-common",
    "rust/tls-virt-guest",
    "rust/tls-virt-wasmtime",
    "timing-lab",
    "examples/quic-loopback",
    "examples/test-signer",
    "examples/webcrypto-signer",
    "examples/tls-tcp",
    "examples/tls-virt-demo",
    "examples/tls-virt-demo-p2",
    "bench/tls-bench",
    "bench/tls-component-bench",
    "bench/quic-native-bench",
    "conformance/guest-ct",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
polymorph-tls-profile = { path = "rust/profile" }

rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = "1"
# Pinned to the audited revision (rust/tls/README.md records the audit);
# bump deliberately and re-audit. Upstream has no usable release.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "7b44a2de957b6596d267a920d3aec0d4137defb1", default-features = false, features = ["std", "zeroize"] }
noq-proto = { version = "1.1", default-features = false, features = ["rustls"] }

ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }

polymorph-tls = { path = "rust/tls" }
polymorph-tls-quic = { path = "rust/quic" }
tls-virt-common = { path = "rust/tls-virt-common" }

wasi = "0.14"
wit-bindgen = { version = "0.60", features = ["async-spawn"] }
wasip3 = "0.7"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# The conformance stack, pinned to one revision everywhere it appears:
# this rev, the `component-test`/`ct-runner` installs derived from
# Cargo.lock by `conformance/driver-ct/justfile`, the deltic browser
# driver's package.json pin, and the `polymorph-test/actions/*@<rev>`
# refs in ci.yml (the actions fail on skew). To bump: `component-test
# pins bump <rev> --cargo-toml Cargo.toml --package-json
# conformance/driver-ct/deltic/package.json --workflow
# .github/workflows/ci.yml`, then the follow-ups it prints.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "b4026866e481ead0738742e3b380601b605e5350" }

aead = { version = "0.6", default-features = false, features = ["alloc"] }
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
chacha20 = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }
bytes = "1"
