# Target capability manifest for the polymorph:tls conformance suite.
# A target is a composition of the shared suite with one delivery of
# the algorithm profile: the wasmtime rows run under the generic
# component-test host runner (the composed artifact imports only wasi
# and test-context), and the deltic rows runtime-link the same
# artifacts under the release-pinned deltic runtime — on stock Deno
# (driver-ct/deltic/run.ts) and inside headless Chromium
# (driver-ct/deltic/run-browser.mjs).
#
# The browser rows gate in CI (the Actions image ships Chrome);
# locally they run under CONFORMANCE_BROWSER=1, so they are declared
# optional — a missing results file is a warning, not an error.
version = "0.1"

# The target's TLS stack has a composed `polymorph:tls/signer`, so
# delegated identities are constructible. Targets without it run the
# `!delegated-signer` decline case instead.
[features.delegated-signer]
kind = "gated"

# The suite plugged with the `tls` world build: in-guest Ed25519
# signing only.
[targets.composed]
missing-features = ["delegated-signer"]

# The suite plugged with the `tls-delegated` world build carrying the
# fixture signer (examples/test-signer, Ed25519).
[targets.composed-delegated]
missing-features = []

# The composed artifact runtime-linked under deltic on stock Deno
# (driver-ct/deltic/run.ts): no transpile step, no engine flag — the
# release-pinned runtime links the component at load time.
[targets.deltic-deno]
missing-features = ["delegated-signer"]

# The composed-delegated artifact under deltic on stock Deno.
[targets.deltic-deno-delegated]
missing-features = []

# As composed-delegated, but the signer is the webcrypto-signer shim
# over a real polymorph:webcrypto provider (the sibling repository,
# cloned and built at the rev pinned alongside the shim's vendored
# WIT). Heavier than the standing targets, so on demand
# (`just conformance-ct::run-webcrypto`) and absent from CI runs and
# the committed matrix.
[targets.composed-delegated-webcrypto]
missing-features = []
optional = true

# The composed artifact runtime-linked inside headless Chromium (the
# upstream deltic worker; no transpile step).
[targets.deltic-browser]
missing-features = ["delegated-signer"]
optional = true

# The composed-delegated artifact runtime-linked inside headless
# Chromium.
[targets.deltic-browser-delegated]
missing-features = []
optional = true
