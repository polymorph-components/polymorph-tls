name: CI

# The pull-request gate: the same recipes a developer runs, split into the
# static checks, the smoke/virtualizer rigs, the conformance matrix, and
# the cross-implementation interop legs. The job bodies live in the
# justfiles; the workflow only provisions the environment. The timing lab
# is deliberately not here — it is statistical and schedule-only
# (timing-lab.yml); `just bench` is non-gating by design.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `just check` (fmt, clippy all-features, workspace tests, wasm build)
  # plus `just audit` (no table-based AES reachable in the release wasm
  # artifact — the audit needs the release build, so it shares this job's
  # cache).
  rust-checks:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache: clippy all-features compiles the
    # wasmtime-embedding delivery from scratch.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        # The toolchain version, wasm target, and components are pinned in
        # rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true
          # PR branches restore but never save, so they don't evict main's
          # caches under the repository cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just check
      - run: just audit

  # The QUIC loopback rig under Wasmtime (`just smoke-quic`) and both
  # tls-virt deliveries against openssl over real TCP
  # (`just smoke-tls-virt`). openssl and python3 are on the runner image.
  smoke:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache (the tls-virt-wasmtime leg builds the
    # wasmtime embedding); the cap also stops a hung handshake from waiting
    # out the default 6h limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install just, wasmtime, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasmtime,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just smoke-quic
      - run: just smoke-tls-virt

  # The cross-implementation conformance suite (`just conformance`): the
  # shared guest suite composed with each delivery, run under the pinned
  # component-test runner and validated against the committed inventory,
  # manifest, and matrix. The aggregate action republishes the matrix to
  # the job summary; the just gate has already gated.
  conformance:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache plus the ct-tools install.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compute the pinned component-test revision
        id: ct-rev
        run: |
          rev=$(grep -m1 -A2 '^name = "component-test-sdk"' Cargo.lock | grep -oE '[0-9a-f]{40}' | head -n1)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Cache the component-test tools
        uses: actions/cache@v4
        with:
          path: target/ct-tools
          key: component-test-tools-${{ runner.os }}-${{ steps.ct-rev.outputs.rev }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install just, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just conformance
      - name: Check the aggregate action refs match the pin
        if: always()
        run: |
          if grep -E 'polymorph-test/actions/aggregate@[0-9a-f]{40}' .github/workflows/ci.yml | grep -qv "@${{ steps.ct-rev.outputs.rev }}"; then
            echo "aggregate action ref skew: not at the Cargo.lock rev ${{ steps.ct-rev.outputs.rev }}" >&2
            exit 1
          fi
      - name: Publish the conformance matrix
        if: always() && hashFiles('conformance/driver-ct/results/*.jsonl') != ''
        uses: polymorph-components/polymorph-test/actions/aggregate@824d100349dc7804c9bf1723d9b1ba0ed40fa940
        with:
          lock: conformance/guest-ct/tests.lock
          manifest: conformance/driver-ct/targets.toml
          results: |
            composed=conformance/driver-ct/results/composed.jsonl
            composed-delegated=conformance/driver-ct/results/composed-delegated.jsonl
          summary-title: Conformance matrix
          cli: target/ct-tools/bin/component-test
      - name: Upload the conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance/driver-ct/results/*.jsonl
            conformance/driver-ct/results/matrix.md
          retention-days: 30

  # Cross-implementation interop over real transports (`just interop`):
  # the composed component against OpenSSL and Go crypto/tls peers over
  # TCP, and the noq leg against quic-go over UDP, both directions,
  # under a fresh Ed25519 private PKI per run.
  interop:
    runs-on: ubuntu-latest
    # Cap so a hung handshake or stuck peer fails fast.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: interop
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Go (the interop peer)
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/interop/peer/go.mod
          cache-dependency-path: scripts/interop/peer/go.sum
      - name: Install just, wasmtime, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasmtime,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just interop
