name: CI

# The pull-request gate: each job runs exactly one `gha::` job recipe, so
# `just ci` is exactly CI; the workflow only provisions the environment.
# The timing lab is deliberately not here — it is statistical and
# schedule-only (timing-lab.yml); `just bench` is non-gating by design.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `just gha::rust-checks`: fmt, clippy, tests, wasm build, plus the
  # AES-table audit, which needs the release build and so shares this
  # job's cache.
  rust-checks:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache: clippy all-features compiles the
    # wasmtime-embedding delivery from scratch.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        # The toolchain version, wasm target, and components are pinned in
        # rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true
          # PR branches restore but never save, so they don't evict main's
          # caches under the repository cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just gha::rust-checks

  # `just gha::smoke`: the QUIC loopback rig under Wasmtime and both
  # tls-virt deliveries against openssl over real TCP. openssl and
  # python3 are on the runner image.
  smoke:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache (the tls-virt-wasmtime leg builds the
    # wasmtime embedding); the cap also stops a hung handshake from waiting
    # out the default 6h limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install just, wasmtime, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasmtime,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just gha::smoke

  # `just gha::conformance-checks`: the shared guest suite composed with
  # each delivery, run under the pinned component-test runner and
  # validated against the committed inventory, manifest, and matrix. The
  # aggregate action republishes the matrix to the job summary; the just
  # gate has already gated.
  conformance:
    runs-on: ubuntu-latest
    # Headroom for a cold cargo cache plus the ct-tools install.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the component-test tools at the pinned revision
        # Owns the rev derivation, the rev-keyed tools cache, the
        # install, and the pins gate; `just conformance`'s _ct-tools
        # recognizes the stamped install and does not repeat it.
        uses: polymorph-components/polymorph-test/actions/setup@b4026866e481ead0738742e3b380601b605e5350
        with:
          js-locks: |
            conformance/driver-ct/jco/package-lock.json
            conformance/driver-ct/deltic/package-lock.json
      - name: Set up Node 24 (the jco-node legs; JSPI)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/driver-ct/jco/package-lock.json
      - name: Set up Deno (the deltic-deno legs; stock, no flags)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - name: Install just, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just gha::conformance-checks
      - name: Publish the conformance matrix
        if: always() && hashFiles('conformance/driver-ct/results/*.jsonl') != ''
        uses: polymorph-components/polymorph-test/actions/aggregate@b4026866e481ead0738742e3b380601b605e5350
        with:
          lock: conformance/guest-ct/tests.lock
          manifest: conformance/driver-ct/targets.toml
          results: |
            composed=conformance/driver-ct/results/composed.jsonl
            composed-delegated=conformance/driver-ct/results/composed-delegated.jsonl
            jco-node=conformance/driver-ct/results/jco-node.jsonl
            jco-node-delegated=conformance/driver-ct/results/jco-node-delegated.jsonl
            deltic-deno=conformance/driver-ct/results/deltic-deno.jsonl
            deltic-deno-delegated=conformance/driver-ct/results/deltic-deno-delegated.jsonl
            jco-browser=conformance/driver-ct/results/jco-browser.jsonl
            jco-browser-delegated=conformance/driver-ct/results/jco-browser-delegated.jsonl
            deltic-browser=conformance/driver-ct/results/deltic-browser.jsonl
            deltic-browser-delegated=conformance/driver-ct/results/deltic-browser-delegated.jsonl
          summary-title: Conformance matrix
          cli: target/ct-tools/bin/component-test
          # The action fails on a uses: ref that skews from this pin.
          cargo-lock: Cargo.lock
      - name: Upload the conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance/driver-ct/results/*.jsonl
            conformance/driver-ct/results/matrix.md
          retention-days: 30

  # `just gha::interop`: cross-implementation interop over real
  # transports — the composed component against OpenSSL and Go crypto/tls
  # peers over TCP, and the noq leg against quic-go over UDP, both
  # directions, under a fresh Ed25519 private PKI per run.
  interop:
    runs-on: ubuntu-latest
    # Cap so a hung handshake or stuck peer fails fast.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: interop
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Go (the interop peer)
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/interop/peer/go.mod
          cache-dependency-path: scripts/interop/peer/go.sum
      - name: Install just, wasmtime, wasm-tools, and wac
        # wac-cli has no install-action manifest; the action falls back to
        # cargo-binstall for it, which resolves releases through
        # api.github.com — the token moves that off the shared per-IP
        # rate limit.
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasmtime,wasm-tools,wac-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just gha::interop
